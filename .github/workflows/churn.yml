name: Churn numerical and local workflow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r churn/requirements.txt
      - run: python -m unittest discover -s churn -p 'test_*.py' -v
