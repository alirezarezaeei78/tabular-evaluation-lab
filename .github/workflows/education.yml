name: Educational model checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  educational-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r education/logistic-vs-boosting/requirements.txt
      - run: python education/logistic-vs-boosting/compare.py --output local-output/education-ci
